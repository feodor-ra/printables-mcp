name: CI
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check
      - name: Ty
        run: uv run ty check

  test:
    name: "Test (${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pytest
        run: uv run pytest --cov

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build
        run: uv build
      # The installed wheel must import cleanly and expose all tools
      - name: Smoke test the wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "from printables_mcp.server import TOOLS, create_server; create_server(); assert len(TOOLS) == 8"

  docker:
    name: "Docker"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t printables-mcp .
      # Directories such as Glama build this Dockerfile and list the tools over stdio
      - name: Smoke test the image
        run: |
          {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | docker run -i --rm printables-mcp > out.jsonl
          python3 -c "import json; r = [json.loads(l) for l in open('out.jsonl')]; assert len(r[-1]['result']['tools']) == 8, r"
