name: uv package publish
on:
  release:
    types: ["published"]

jobs:
  ci:
    name: "CI"
    uses: ./.github/workflows/ci.yml

  check-version:
    name: "Check tag matches project version"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare release tag with pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag != version:
              sys.exit(f"Release tag {tag!r} does not match project version {version!r}")
          print(f"Release tag matches project version {version}")
          EOF

  publish:
    name: "Build and publish release"
    runs-on: ubuntu-latest
    needs: [ci, check-version]
    environment:
      name: pypi
      url: https://pypi.org/project/printables-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish

  mcp-registry:
    name: "Publish to the MCP Registry"
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Set version in server.json
        run: |
          version="${RELEASE_TAG#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      # The registry reads the package description from PyPI, which may lag a few seconds behind the upload
      - name: Publish server to MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          exit 1
