version: 2

updates:
  # Python tooling: update the dev dependency group only.
  # allow=development limits PRs to non-production deps; the runtime contract
  # (mcp, httpx2, pydantic, markdownify, anyio) is bumped by hand.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "development"
    groups:
      python-dev:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions pinned in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
